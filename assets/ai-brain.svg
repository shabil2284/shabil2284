<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <!-- Region glow filters -->
    <filter id="glow-cyan" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-purple" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-teal" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-indigo" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Soft interior haze -->
    <radialGradient id="core-haze" cx="50%" cy="48%" r="55%">
      <stop offset="0%"   stop-color="#1e3a5f" stop-opacity="0.55"/>
      <stop offset="45%"  stop-color="#0f2038" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#020408" stop-opacity="0"/>
    </radialGradient>
    <!-- Volume shading on shell -->
    <radialGradient id="shell-shade" cx="42%" cy="38%" r="70%">
      <stop offset="0%"   stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="60%"  stop-color="#38bdf8" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.02"/>
    </radialGradient>
    <linearGradient id="connection-fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#38bdf8" stop-opacity="0.05"/>
      <stop offset="50%"  stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- ===== HOLOGRAPHIC SHELL ===== -->
  <g opacity="0.9">
    <ellipse cx="600" cy="400" rx="340" ry="265" fill="url(#core-haze)"/>
    <ellipse cx="600" cy="400" rx="345" ry="268" fill="none"
             stroke="#38bdf8" stroke-width="1" opacity="0.20"/>
    <ellipse cx="600" cy="400" rx="345" ry="268" fill="url(#shell-shade)"/>

    <!-- Wireframe latitude bands (ellipses squashed toward poles) -->
    <ellipse cx="600" cy="400" rx="345" ry="268" fill="none" stroke="#38bdf8" stroke-width="0.8" opacity="0.13"/>
    <ellipse cx="600" cy="400" rx="338" ry="215" fill="none" stroke="#38bdf8" stroke-width="0.8" opacity="0.11"/>
    <ellipse cx="600" cy="400" rx="310" ry="155" fill="none" stroke="#38bdf8" stroke-width="0.8" opacity="0.09"/>
    <ellipse cx="600" cy="400" rx="250" ry="85"  fill="none" stroke="#38bdf8" stroke-width="0.8" opacity="0.07"/>

    <!-- Rotated longitude bands to suggest 3D volume -->
    <ellipse cx="600" cy="400" rx="120" ry="268" fill="none" stroke="#a78bfa" stroke-width="0.8" opacity="0.10"
             transform="rotate(0 600 400)"/>
    <ellipse cx="600" cy="400" rx="120" ry="268" fill="none" stroke="#a78bfa" stroke-width="0.8" opacity="0.08"
             transform="rotate(28 600 400)"/>
    <ellipse cx="600" cy="400" rx="120" ry="268" fill="none" stroke="#a78bfa" stroke-width="0.8" opacity="0.08"
             transform="rotate(-28 600 400)"/>
    <ellipse cx="600" cy="400" rx="220" ry="268" fill="none" stroke="#06b6d4" stroke-width="0.8" opacity="0.07"
             transform="rotate(0 600 400)"/>

    <!-- Front-facing organic fold curves for brain-like surface -->
    <path d="M 320 340 Q 460 260 620 300 T 880 340" fill="none" stroke="#38bdf8" stroke-width="0.9" opacity="0.10"/>
    <path d="M 300 460 Q 470 540 640 500 T 900 450" fill="none" stroke="#38bdf8" stroke-width="0.9" opacity="0.09"/>
    <path d="M 400 250 Q 560 200 700 260"               fill="none" stroke="#a78bfa" stroke-width="0.8" opacity="0.08"/>
  </g>

  <!-- ===== NEURAL CONNECTIONS ===== -->
  <g stroke="url(#connection-fade)" stroke-width="1" fill="none">
    <line x1="600" y1="180" x2="520" y2="200"/>
    <line x1="600" y1="180" x2="690" y2="195"/>
    <line x1="520" y1="200" x2="450" y2="235"/>
    <line x1="690" y1="195" x2="760" y2="240"/>
    <line x1="520" y1="200" x2="610" y2="225"/>
    <line x1="610" y1="225" x2="690" y2="195"/>
    <line x1="450" y1="235" x2="380" y2="275"/>
    <line x1="450" y1="235" x2="530" y2="265"/>
    <line x1="760" y1="240" x2="820" y2="290"/>
    <line x1="680" y1="270" x2="760" y2="240"/>
    <line x1="380" y1="275" x2="320" y2="320"/>
    <line x1="380" y1="275" x2="470" y2="315"/>
    <line x1="530" y1="265" x2="620" y2="310"/>
    <line x1="680" y1="270" x2="620" y2="310"/>
    <line x1="820" y1="290" x2="860" y2="375"/>
    <line x1="770" y1="325" x2="820" y2="290"/>
    <line x1="320" y1="320" x2="280" y2="370"/>
    <line x1="470" y1="315" x2="420" y2="365"/>
    <line x1="620" y1="310" x2="570" y2="360"/>
    <line x1="720" y1="370" x2="770" y2="325"/>
    <line x1="280" y1="370" x2="270" y2="425"/>
    <line x1="420" y1="365" x2="400" y2="420"/>
    <line x1="570" y1="360" x2="550" y2="415"/>
    <line x1="570" y1="360" x2="640" y2="380"/>
    <line x1="720" y1="370" x2="700" y2="425"/>
    <line x1="860" y1="375" x2="840" y2="430"/>
    <line x1="270" y1="425" x2="300" y2="480"/>
    <line x1="400" y1="420" x2="440" y2="475"/>
    <line x1="550" y1="415" x2="590" y2="470"/>
    <line x1="700" y1="425" x2="740" y2="480"/>
    <line x1="840" y1="430" x2="880" y2="485"/>
    <line x1="300" y1="480" x2="350" y2="530"/>
    <line x1="440" y1="475" x2="490" y2="525"/>
    <line x1="590" y1="470" x2="640" y2="530"/>
    <line x1="740" y1="480" x2="790" y2="540"/>
    <line x1="880" y1="485" x2="790" y2="540"/>
    <line x1="350" y1="530" x2="420" y2="575"/>
    <line x1="490" y1="525" x2="570" y2="570"/>
    <line x1="640" y1="530" x2="720" y2="580"/>
    <line x1="420" y1="575" x2="500" y2="615"/>
    <line x1="570" y1="570" x2="650" y2="610"/>
    <line x1="720" y1="580" x2="650" y2="610"/>
    <line x1="500" y1="615" x2="575" y2="645"/>
    <line x1="650" y1="610" x2="575" y2="645"/>
    <!-- Interior cross-links -->
    <line x1="560" y1="340" x2="680" y2="320"/>
    <line x1="600" y1="450" x2="520" y2="440"/>
    <line x1="620" y1="500" x2="680" y2="460"/>
    <line x1="680" y1="320" x2="720" y2="370"/>
  </g>

  <!-- ===== NEURAL NODES ===== -->
  <!-- Indigo = ML | Teal = GenAI | Purple = Agentic | Cyan = CV / Eng / Cloud -->

  <!-- ML (indigo) -->
  <g filter="url(#glow-indigo)" fill="#818cf8">
    <circle cx="520" cy="200" r="4.5"/>
    <circle cx="380" cy="275" r="4"/>
    <circle cx="470" cy="315" r="4.5"/>
    <circle cx="720" cy="370" r="4"/>
    <circle cx="440" cy="475" r="4.5"/>
    <circle cx="640" cy="530" r="4"/>
    <circle cx="560" cy="340" r="3.5"/>
  </g>

  <!-- GenAI (teal) -->
  <g filter="url(#glow-teal)" fill="#06b6d4">
    <circle cx="600" cy="180" r="5"/>
    <circle cx="690" cy="195" r="4.5"/>
    <circle cx="530" cy="265" r="4"/>
    <circle cx="620" cy="310" r="5"/>
    <circle cx="770" cy="325" r="4"/>
    <circle cx="550" cy="415" r="4.5"/>
    <circle cx="790" cy="540" r="4"/>
    <circle cx="600" cy="450" r="3.5"/>
  </g>

  <!-- Agentic (purple) -->
  <g filter="url(#glow-purple)" fill="#a78bfa">
    <circle cx="450" cy="235" r="4.5"/>
    <circle cx="680" cy="270" r="5"/>
    <circle cx="570" cy="360" r="4.5"/>
    <circle cx="420" cy="365" r="4"/>
    <circle cx="700" cy="425" r="5"/>
    <circle cx="490" cy="525" r="4"/>
    <circle cx="720" cy="580" r="4.5"/>
    <circle cx="680" cy="320" r="3.5"/>
  </g>

  <!-- CV / Eng / Cloud (cyan) -->
  <g filter="url(#glow-cyan)" fill="#38bdf8">
    <circle cx="760" cy="240" r="4.5"/>
    <circle cx="820" cy="290" r="4"/>
    <circle cx="320" cy="320" r="4.5"/>
    <circle cx="280" cy="370" r="4"/>
    <circle cx="270" cy="425" r="3.5"/>
    <circle cx="400" cy="420" r="4.5"/>
    <circle cx="860" cy="375" r="4"/>
    <circle cx="840" cy="430" r="4"/>
    <circle cx="300" cy="480" r="4"/>
    <circle cx="590" cy="470" r="4.5"/>
    <circle cx="740" cy="480" r="4"/>
    <circle cx="880" cy="485" r="3.5"/>
    <circle cx="350" cy="530" r="4"/>
    <circle cx="570" cy="570" r="4.5"/>
    <circle cx="420" cy="575" r="4"/>
    <circle cx="500" cy="615" r="4"/>
    <circle cx="650" cy="610" r="4.5"/>
    <circle cx="575" cy="645" r="3.5"/>
    <circle cx="610" cy="225" r="4"/>
    <circle cx="520" cy="440" r="3.5"/>
    <circle cx="620" cy="500" r="3.5"/>
  </g>

  <!-- ===== HIGHLIGHTED NODE (sample hovered state) ===== -->
  <g filter="url(#glow-cyan)">
    <circle cx="680" cy="270" r="11" fill="#a78bfa" opacity="0.35"/>
    <circle cx="680" cy="270" r="6"  fill="#c4b5fd"/>
    <circle cx="680" cy="270" r="2.2" fill="#ffffff"/>
  </g>

  <!-- ===== SAMPLE TOOLTIP ===== -->
  <g transform="translate(712 232)">
    <rect x="0" y="0" width="196" height="46" rx="8"
          fill="#080c14" fill-opacity="0.85"
          stroke="#38bdf8" stroke-opacity="0.45" stroke-width="1"/>
    <!-- pulsing indicator dot (static in preview) -->
    <circle cx="20" cy="23" r="4" fill="#38bdf8"/>
    <circle cx="20" cy="23" r="8" fill="#38bdf8" opacity="0.18"/>
    <text x="38" y="28"
          font-family="'JetBrains Mono','SF Mono',monospace"
          font-size="13" font-weight="700" letter-spacing="1.4"
          fill="#e2e8f0">MULTI-AGENT SYSTEMS</text>
  </g>
  <!-- Connector line from node to tooltip -->
  <line x1="680" y1="270" x2="712" y2="255"
        stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 3" opacity="0.7"/>
</svg>